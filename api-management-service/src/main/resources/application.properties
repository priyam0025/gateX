spring.application.name=api-management-service
server.port=8081

info.app.name=API Management service
info.app.description=Management service for users, routes and gateway policies

spring.datasource.url=jdbc:mysql://localhost:3306/gatex-management?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=gatex_user
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

security.jwt.expiration-seconds=3600
security.jwt.secret=gatex-demo-jwt-secret-key-change-before-production

gateway.kafka.configuration-topic=${GATEX_CONFIGURATION_TOPIC:gateway-configuration-events}
spring.kafka.bootstrap-servers=${GATEX_KAFKA_SERVERS:localhost:9092}